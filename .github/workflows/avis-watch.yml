name: Avis Hourly Check

# Sends a Telegram nudge every hour with the AARP code, a rolling 30-day window,
# and in-range pickup locations. (Avis/PerimeterX blocks automated price reads
# from CI, so this hands you a 10-second human check instead.)
on:
  schedule:
    - cron: "0 * * * *" # top of every hour (UTC). GitHub may delay a few minutes.
  workflow_dispatch: {} # run on-demand from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Send hourly Telegram check
        run: node notify.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AWD_CODE: ${{ secrets.AWD_CODE }}
          BUDGET_USD: "900"
